<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login Screen</title>
</head>
<body>
   <section class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-gray-100 flex rounded-2xl shadow-lg max-w-3xl p-5">

    <div class="md:w-1/2 px-16">
        <h2 class="text-fuchsia-900 text-2xl" font-bold >Wellcome back</h2>
        <p class="text-sm mt-4">Login to your account to book your next unforgettable event</p>

        <form action="" class="flex flex-col gap-4">
            <input class="p-2 mt-8 rounded-x1 border" type="text" name="email" placeholder="Email">
            <input class="p-2 rounded-x1 border" type="password" name="password" placeholder="password">
            <button class="bg-fuchsia-900 rounded-x1 text-white py-2 hover:scale-110 duration-300">Login</button>
        </form>

        <div class="mt-10 grid grid-cols-3 items-center text-gray-400">
            <hr class="border-gray-400">
            <p class="text-center">OR</p>
            <hr class="border-gray-400">
        </div>

        <button class="bg-white border py-2 w-full rounded-x1 mt-5 flex justify-center items-center hover:scale-110 duration-300"> <img class="mr-3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlsMEdLh2jtv7Q3soyzGpvR7IoHst8MPq2bqAnlyNsYg&s=10" width="20px" height="25px" alt="">Login with google</button>

        <p class="mt-5 text-xs border-b border-gray-400 py-4">Forgot your password?</p>

        <div class="mt-3 text-xs flex justify-between items-center">
            <p>Don't have an account..</p>
            <button class="py-2 px-5 bg-white border rounder-x1 hover:scale-110 duration-300">Register</button>
        </div>
    </div>

    <div class="md:block hidden w-1/2 ">
        <img class="rounded-2xl" src= "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4OK3QNT3beeOugKPir-ogvhL9KWUvYYObzQayEEnlsQ&s=10" alt="">
    </div>

   </div>
   </section>

   
</body>
</html>
