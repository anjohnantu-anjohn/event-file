<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Register screen</title>
</head>
<body>
<section class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-gray-100 flex rounded-3xl shadow-lg max-w-4xl p-5">

    <div class="md:w-1/2 px-16">
        <h2 class="text-fuchsia-900 text-2xl" font-bold >Create Your Account</h2>
        <p class="text-sm mt-4">Join Evenora and start planing your dream events</p>
        <br>

        <form action="" class="flex flex-col mt-3">
            <label class="block text-base" for="usename mb-2">Username</label>
            <input class="p-2  rounded-x1 border" type="text" name="Enter your user name" placeholder="Enter your user name">
            <br>
            <label class="block text-base" for="Email mb-2">Email</label>
            <input class="p-2 rounded-x1 border" type="Enter your email address " name="Enter your email adress " placeholder="Enter your email adress">
            <br>
            <label class="block text-base" for="Password mb-2">Password</label>
            <input class="p-2  rounded-x1 border" type="text" name="Enter your password" placeholder="Enter your password">
            <br>
            <label class="block text-base" for="Confirm Password mb-2">Confirm Password</label>
            <input class="p-2  rounded-x1 border" type="text" name="Enter your password" placeholder="Enter your password">
            <br>

            <button class="bg-fuchsia-900 rounded-x1 text-white py-2 hover:scale-110 duration-300">Register</button>
        </form>

        
        <div class="mt-3 text-xs flex justify-between items-center">
            <p>Already have an account?</p>
            <button class="py-2 px-5 bg-white border rounder-x1 hover:scale-110 duration-300">Login here</button>
        </div>

    </div>

    <div class="md:block hidden w-1/2 ">
        <img class="rounded-2xl" src= "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhNVd25J0_NWI-MxatmbljtTmm_ftrZ4jj7bvA5_mTjw&s=10" alt="">
    </div>

   </div>
        
   </section>

   
</body>
</html>
    
    
</body>
</html>
